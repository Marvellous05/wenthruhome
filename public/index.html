<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Wenthruhome serviced apartments and short-let stays in Lagos."
  >

  <title>Wenthruhome | Stay beautifully.</title>

  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Wenthruhome home">
      <img
        id="siteLogo"
        class="main-logo"
        src="/assets/logo.png"
        alt="Wenthruhome"
      >
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#homes">Apartments</a>
      <a href="#experience">Experience</a>
      <a href="#location">Locations</a>
      <a href="#contact">Contact</a>
    </nav>

    <a class="top-cta" href="#homes">
      Find a stay <span aria-hidden="true">↗</span>
    </a>

    <button
      class="menu-btn"
      id="menuBtn"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="mobileNav"
    >
      ☰
    </button>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <a href="#homes">Apartments</a>
    <a href="#experience">Experience</a>
    <a href="#location">Locations</a>
    <a href="#contact">Contact</a>
  </div>

  <main id="app"></main>

  <footer id="contact" class="footer">
    <div class="footer-brand">
      <a class="brand" href="/" aria-label="Wenthruhome home">
        <img
          class="footer-logo"
          src="/assets/logo.png"
          alt="Wenthruhome"
        >
      </a>

      <p>
        Beautifully prepared spaces for short stays, long stays
        and everything in between.
      </p>
    </div>

    <div class="footer-column">
      <b>Explore</b>
      <a href="#homes">Apartments</a>
      <a href="#experience">Why Wenthruhome</a>
      <a href="#location">Locations</a>
    </div>

    <div class="footer-column">
      <b>Get in touch</b>
      <span>Lagos, Nigeria</span>
      <a id="footerWhatsApp" href="#">WhatsApp us</a>
    </div>

    <div class="footer-bottom">
      © <span id="year"></span> Wenthruhome. All rights reserved.
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
